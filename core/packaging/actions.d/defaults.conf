; HoneyBan action definitions (Fail2Ban-style action.d direction)
;
; Placeholders in ban_cmd:
;   {action} {jail} {filter} {ip} {proto} {port} {ttl} {level}
;
; Keys:
;   enabled=on|off
;   base=none|banip|banipport|blockport
;   ban_cmd=<shell command template>
;   timeout_ms=10..30000

[banip]
enabled=on
base=banip

[banipport]
enabled=on
base=banipport

[blockport]
enabled=on
base=blockport

; Example custom action: perform kernel ban + local logging
[banip-notify]
enabled=off
base=banip
ban_cmd=logger "honeyban action={action} jail={jail} ip={ip} ttl={ttl} level={level}"
timeout_ms=1000
