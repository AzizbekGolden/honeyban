; HoneyBan filter: Dropbear SSH auth failures

[dropbear-ssh]
enabled=on
syslog_identifier=dropbear
prefilter=Bad password,Login attempt for nonexistent user,Exit before auth
ip_group=1
regex=Bad password attempt for .* from ([0-9A-Fa-f:.]+):[0-9]+
regex=Login attempt for nonexistent user .* from ([0-9A-Fa-f:.]+):[0-9]+
regex=Exit before auth from <([0-9A-Fa-f:.]+):[0-9]+>
