; HoneyBan jails.conf (Fail2Ban-style policy)
;
; Format: INI sections. Each section is a "jail".
; Values are key=value. Comments start with ';' or '#'.
;
; Keys:
;   enabled   = on|off
;   detector  = journal|ssh|portscan|synflood
;   action    = banip|banipport|blockport|<custom-action-name>
;   maxretry  = integer (threshold)
;   findtime  = seconds (sliding window)
;   bantime   = seconds (0 = permanent)
;   ban_level = 1..5 (severity label)
;   protocol  = tcp|udp|any
;   ports     = comma-separated list (only for ssh / ip-port actions)
;   ignoreip  = comma-separated IP/CIDR list (e.g. 10.0.0.0/8, 127.0.0.1)
;   filter    = filter name (only for detector=journal; defined in filters.d)
;              custom action names are defined in actions.d
;
; Note:
; - For maximum performance, keep telemetry off unless you need portscan/synflood/ssh rate detection.
; - SSH auth failures (journal + filters) do not require telemetry, but require HONEYBAN_JOURNAL_ENABLED=1 and filters.d.

[ssh]
enabled=on
detector=journal
filter=sshd
action=banip
maxretry=5
findtime=60
bantime=3600
ban_level=3
protocol=tcp
ports=22
ignoreip=127.0.0.1/32,::1/128,10.0.0.0/8,192.168.0.0/16,172.16.0.0/12

[portscan]
enabled=on
detector=portscan
action=banip
maxretry=20
findtime=10
bantime=600
ban_level=3
protocol=tcp
ignoreip=127.0.0.1/32,::1/128,10.0.0.0/8,192.168.0.0/16,172.16.0.0/12

[synflood]
enabled=on
detector=synflood
action=banip
maxretry=200
findtime=1
bantime=300
ban_level=3
protocol=tcp
ignoreip=127.0.0.1/32,::1/128,10.0.0.0/8,192.168.0.0/16,172.16.0.0/12
